name: CI

on:
  push:
    branches: [cleanup-2.0, main]
  pull_request:
    branches: [cleanup-2.0, main]

jobs:
  light:
    name: Light core (no torch)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (core + dev only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Light-import contract
        run: pytest tests/unit/test_light_imports.py -q

      - name: Torch-free unit subset
        run: >
          pytest -q
          tests/unit/test_light_imports.py
          tests/unit/datasets
          tests/unit/tokenizers
          -m "not gpu and not cuda"

  test:
    name: Unit tests with torch (no GPU)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (core + train + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,train]"

      - name: Unit tests (no GPU / no HF)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >
          pytest -q
          -m "not gpu and not cuda and not huggingface and not qlora
          and not bitsandbytes and not multi_gpu and not distributed and not fsdp"
          --ignore=tests/web
          --ignore=tests/gpu
          --ignore=tests/phase3

      - name: Build check
        run: |
          pip install build twine
          python -m build
          twine check dist/*

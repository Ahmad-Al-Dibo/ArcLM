name: CI

on:
  push:
    branches: [cleanup-2.0, main]
  pull_request:
    branches: [cleanup-2.0, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Light-import contract
        run: pytest tests/unit/test_light_imports.py -q

      - name: Unit tests (no GPU / no HF)
        run: >
          pytest -q
          -m "not gpu and not cuda and not huggingface and not qlora
          and not bitsandbytes and not multi_gpu and not distributed and not fsdp"
          --ignore=tests/web

      - name: Build check
        run: |
          pip install build twine
          python -m build
          twine check dist/*

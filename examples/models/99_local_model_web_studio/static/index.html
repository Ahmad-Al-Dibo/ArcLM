<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArcLM Local Model Studio</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f7f7f4; color: #202124; }
    header, main { max-width: 1100px; margin: 0 auto; padding: 24px; }
    header { border-bottom: 1px solid #d8d8d0; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    .card { border: 1px solid #d8d8d0; border-radius: 8px; background: white; padding: 14px; }
    button, input, select, textarea { font: inherit; }
    button { border: 1px solid #444; background: #202124; color: white; border-radius: 6px; padding: 8px 10px; }
    textarea { width: 100%; min-height: 90px; box-sizing: border-box; }
    .status { font-size: 13px; color: #555; }
  </style>
</head>
<body>
  <header>
    <h1>ArcLM Local Model Studio</h1>
    <div class="status" id="status">Catalogus laden...</div>
  </header>
  <main>
    <section class="grid" id="catalog"></section>
    <section>
      <h2>Generatie</h2>
      <select id="model"></select>
      <textarea id="prompt">Leg veilig lokaal laden kort uit.</textarea>
      <button id="generate">Genereer</button>
      <pre id="output"></pre>
    </section>
  </main>
  <script>
    async function loadCatalog() {
      const response = await fetch('/api/models');
      const data = await response.json();
      const catalog = document.getElementById('catalog');
      const select = document.getElementById('model');
      catalog.innerHTML = '';
      select.innerHTML = '';
      for (const model of data.models) {
        const option = document.createElement('option');
        option.value = model.id;
        option.textContent = model.display_name;
        select.appendChild(option);
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `<strong>${model.display_name}</strong><br>${model.family}<br>${model.model_kind}<br>${model.operations.model_load}`;
        catalog.appendChild(card);
      }
      document.getElementById('status').textContent = `${data.models.length} modellen uit manifest`;
    }
    document.getElementById('generate').addEventListener('click', async () => {
      const model = document.getElementById('model').value;
      const prompt = document.getElementById('prompt').value;
      const response = await fetch(`/api/models/${model}/generate`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({prompt, max_new_tokens: 32})
      });
      document.getElementById('output').textContent = JSON.stringify(await response.json(), null, 2);
    });
    loadCatalog();
  </script>
</body>
</html>

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arclm-agents-tools"
version = "2.0.0"
description = "Provider-independent agent runtime with typed tools, permissions, approvals, tracing and safe builtins. No PyTorch required."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Ahmad Al Dibo" }]
dependencies = []

[project.optional-dependencies]
audio = ["openai-whisper>=20231117"]

[project.scripts]
arclm = "arclm.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["arclm*"]

[tool.setuptools.package-data]
arclm = ["py.typed", "*.pyi"]

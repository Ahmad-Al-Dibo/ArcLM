[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arclm-loading-inference"
version = "2.0.0"
description = "Load native or external models, generate text, and inspect one generation step. Requires PyTorch."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Ahmad Al Dibo" }]
dependencies = [
  "torch>=2.1,<3",
  "numpy>=1.24,<3",
  "sentencepiece>=0.2,<0.3"
]

[project.optional-dependencies]
hf = ["transformers>=4.51,<6", "accelerate>=0.30,<2", "safetensors>=0.4,<1"]

[project.scripts]
arclm = "arclm.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["arclm*"]

[tool.setuptools.package-data]
arclm = ["py.typed", "*.pyi"]

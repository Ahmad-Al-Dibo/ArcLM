[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arclm-simple-interface"
version = "1.13.4"
description = "A standalone local Flask chat interface with model loading, inspection, streaming events, prompt queue and optional safe Agent integration."
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = "Apache-2.0"
authors = [{ name = "Ahmad Al Dibo" }]
dependencies = [
  "torch>=2.1,<3",
  "numpy>=1.24,<3",
  "sentencepiece>=0.2,<0.3",
  "flask>=3,<4"
]

[project.optional-dependencies]
hf = ["transformers>=4.51,<6", "accelerate>=0.30,<2", "safetensors>=0.4,<1"]

[project.scripts]
arclm = "arclm.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["arclm*"]

[tool.setuptools.package-data]
arclm = ["templates/*.html", "py.typed"]

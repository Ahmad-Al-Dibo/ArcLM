[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arclm-core"
version = "2.0.0"
description = "Light ArcLM building block: configuration, datasets, tokenizers, exceptions, registry and utilities. No PyTorch required."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Ahmad Al Dibo" }]
dependencies = [
  "numpy>=1.24,<3",
  "sentencepiece>=0.2,<0.3"
]

[project.scripts]
arclm = "arclm.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["arclm*"]

[tool.setuptools.package-data]
arclm = ["py.typed", "*.pyi"]

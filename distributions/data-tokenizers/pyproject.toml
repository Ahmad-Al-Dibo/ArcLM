[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arclm-data-tokenizers"
version = "1.13.4"
description = "Dataset loading, validation, cleaning, deduplication, statistics and tokenizer utilities."
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = "Apache-2.0"
authors = [{ name = "Ahmad Al Dibo" }]
dependencies = [
  "numpy>=1.24,<3",
  "sentencepiece>=0.2,<0.3"
]

[project.optional-dependencies]
preprocess = ["beautifulsoup4>=4.12,<5", "PyYAML>=6,<7", "tqdm>=4.66,<5"]

[project.scripts]
arclm = "arclm.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["arclm*"]

[tool.setuptools.package-data]
arclm = ["templates/*.html", "py.typed"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arclm-security"
version = "2.0.0"
description = "Policy enforcement, encryption, hashing, signing, redaction and safe path/URL helpers. No PyTorch required."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Ahmad Al Dibo" }]
dependencies = [
  "cryptography>=42,<47"
]

[project.optional-dependencies]
keyring = ["keyring>=25,<27"]

[project.scripts]
arclm = "arclm.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["arclm*"]

[tool.setuptools.package-data]
arclm = ["py.typed", "*.pyi"]

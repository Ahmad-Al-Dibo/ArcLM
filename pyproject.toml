[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arclm"
dynamic = ["version"]
description = "A compact toolkit for language-model data workflows, tokenizers, training (optional torch), and Hugging Face SFT."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Ahmad Al Dibo"}
]
maintainers = [
  { name = "Ahmad Al Dibo"}
]
keywords = [
  "arclm",
  "sft",
  "llm",
  "language-model",
  "causal-language-model",
  "transformer",
  "pytorch",
  "training",
  "fine-tuning",
  "instruction-tuning",
  "nlp",
  "huggingface"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=1.24,<3",
  "sentencepiece>=0.2,<0.3",
]

[project.optional-dependencies]
train = [
  "torch>=2.1,<3",
]
dev = [
  "pytest>=8",
  "build>=1.2,<2",
  "twine>=5,<7",
]
web = [
  "torch>=2.1,<3",
  "flask>=3,<4",
  "fastapi==0.139.0; python_version >= '3.10'",
  "uvicorn==0.51.0; python_version >= '3.10'",
]
agents-audio = [
  "openai-whisper>=20231117",
]
security = [
  "cryptography>=42,<47",
]
security-keyring = [
  "cryptography>=42,<47",
  "keyring>=25,<27",
]
peft = [
  "torch>=2.1,<3",
  "peft>=0.11,<1",
]
qlora = [
  "torch>=2.4,<3",
  "transformers>=4.51,<6",
  "bitsandbytes>=0.49,<1; python_version >= '3.10'",
]
hf = [
  "torch>=2.1,<3",
  "transformers>=4.51,<6",
  "accelerate>=0.30,<2",
  "datasets>=2.18,<4",
  "peft>=0.11,<1",
]
hf-inference = [
  "torch>=2.1,<3",
  "transformers>=4.51,<6",
  "accelerate>=0.30,<2",
  "safetensors>=0.4,<1",
]
examples = [
  "torch>=2.1,<3",
  "transformers>=4.51,<6",
  "accelerate>=0.30,<2",
  "datasets>=2.18,<4",
  "peft>=0.11,<1",
  "safetensors>=0.4,<1",
]
all = [
  "torch>=2.1,<3",
  "transformers>=4.51,<6",
  "flask>=3,<4",
  "fastapi==0.139.0; python_version >= '3.10'",
  "uvicorn==0.51.0; python_version >= '3.10'",
  "accelerate>=0.30,<2",
  "datasets>=2.18,<4",
  "peft>=0.11,<1",
  "safetensors>=0.4,<1",
  "cryptography>=42,<47",
]

[project.urls]
Homepage = "https://github.com/Ahmad-Al-Dibo/ArcLM"
Documentation = "https://github.com/Ahmad-Al-Dibo/ArcLM/blob/cleanup-2.0/docs/guide.md"
Repository = "https://github.com/Ahmad-Al-Dibo/ArcLM"
Issues = "https://github.com/Ahmad-Al-Dibo/ArcLM/issues"
Changelog = "https://github.com/Ahmad-Al-Dibo/ArcLM/blob/cleanup-2.0/CHANGELOG.md"

[project.scripts]
arclm = "arclm.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["arclm*"]

[tool.setuptools.package-data]
arclm = ["py.typed", "*.pyi"]

[tool.setuptools.dynamic]
version = { attr = "arclm._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
markers = [
  "unit: fast unit tests",
  "integration: integration tests",
  "cli: command-line interface tests",
  "docs: documentation tests",
  "security: security-focused tests",
  "config: configuration validation and migration tests",
  "compatibility: compatibility-contract tests",
  "scale: data-scale and large-dataset behavior tests",
  "benchmark: benchmark and performance characterization tests",
  "transformers: tests that require or exercise the Transformers integration boundary",
  "gpu: tests that require GPU-related behavior",
  "cuda: tests that require a CUDA-capable PyTorch runtime",
  "fp16: tests that validate FP16 behavior",
  "bf16: tests that validate BF16 behavior",
  "multi_gpu: tests that require more than one GPU",
  "distributed: tests that validate distributed behavior",
  "fsdp: tests that validate Fully Sharded Data Parallel behavior",
  "checkpoint: tests that validate checkpoint behavior",
  "optimization: tests that validate optional hardware optimization backends",
  "huggingface: tests that require the optional Hugging Face Transformers stack",
  "bitsandbytes: tests that require the optional bitsandbytes backend",
  "qlora: tests that validate QLoRA runtime behavior",
  "cpu_integration: optional CPU integration tests",
  "hf_optional: optional Hugging Face runtime tests",
  "cuda_optional: optional CUDA runtime tests",
]

all-cuda121 = [
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "torchaudio>=2.1,<3",
  "transformers>=4.51,<6",
  "flask>=3,<4",
  "fastapi==0.139.0; python_version >= '3.10'",
  "uvicorn==0.51.0; python_version >= '3.10'",
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
  "accelerate>=0.30,<2",
  "datasets>=2.18,<4",
  "peft>=0.11,<1",
  "safetensors>=0.4,<1",
]

[project.urls]
Homepage = "https://github.com/ahmad-al-dibo/arclm"
Documentation = "https://github.com/ahmad-al-dibo/arclm#readme"
Source = "https://github.com/ahmad-al-dibo/arclm"
Issues = "https://github.com/ahmad-al-dibo/arclm/issues"
Changelog = "https://github.com/ahmad-al-dibo/arclm/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["arclm*"]

[tool.setuptools.package-data]
arclm = ["templates/*.html", "py.typed"]

[tool.setuptools.dynamic]
version = { attr = "arclm._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
markers = [
  "gpu: tests that require GPU-related behavior",
  "cuda: tests that require a CUDA-capable PyTorch runtime",
  "fp16: tests that validate FP16 behavior",
  "bf16: tests that validate BF16 behavior",
  "multi_gpu: tests that require more than one GPU",
  "distributed: tests that validate distributed behavior",
]
